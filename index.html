<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Rendement</title>

<!-- PWA / iOS home screen -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0e14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rendement" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon.png" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <span class="brand">Rendement</span>
    <span id="today-date" class="date"></span>
  </header>

  <!-- ===================== VUE MINUTEUR ===================== -->
  <main id="view-timer" class="view active">

    <section class="hero">
      <div id="hero-status" class="hero-status idle">
        <span class="dot"></span>
        <span id="hero-status-text">En attente</span>
      </div>
      <div id="hero-timer" class="hero-timer">00:00:00</div>
      <div id="hero-hint" class="hero-hint">Appuie sur une catégorie pour démarrer</div>
    </section>

    <section id="cat-list" class="cats"></section>

    <button type="button" id="btn-manage-cats" class="btn-add-cat">+ Ajouter une catégorie</button>

    <footer class="footer">
      <div class="grand-total">
        <span class="grand-total-label">Total non-productif</span>
        <span id="grand-total" class="grand-total-value">00:00</span>
      </div>
      <button type="button" id="btn-save-day" class="btn-save-day">✓ Enregistrer la journée</button>
      <button type="button" id="btn-reset" class="btn-reset">Remettre à zéro sans enregistrer</button>
    </footer>

  </main>

  <!-- ===================== VUE HISTORIQUE ===================== -->
  <main id="view-history" class="view">
    <div id="history-list" class="history-list"></div>
    <p id="history-empty" class="history-empty">Aucune journée enregistrée.<br />Termine ta journée avec « Enregistrer la journée » et elle apparaîtra ici.</p>
  </main>

  <!-- ===================== BARRE D'ONGLETS ===================== -->
  <nav class="tabbar">
    <button type="button" class="tab-btn active" data-view="view-timer">
      <span class="tab-icon">⏱</span>
      <span>Minuteur</span>
    </button>
    <button type="button" class="tab-btn" data-view="view-history">
      <span class="tab-icon">🗓</span>
      <span>Historique</span>
    </button>
  </nav>

  <!-- ===================== MODALE CATEGORIES ===================== -->
  <div id="modal-cats" class="modal-overlay hidden">
    <div class="modal-sheet">
      <h2>Nouvelle catégorie</h2>
      <div class="modal-add-row">
        <input type="text" id="new-cat-input" placeholder="Ex : TEMPS RÉGLAGE" maxlength="30" />
        <button type="button" id="btn-add-cat" class="btn-confirm">Ajouter</button>
      </div>
      <div id="custom-cat-section" class="hidden">
        <h3>Mes catégories</h3>
        <ul id="custom-cat-list" class="custom-cat-list"></ul>
      </div>
      <button type="button" id="modal-cats-close" class="btn-close">Fermer</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

</div>

<script src="js/app.js"></script>
</body>
</html>
