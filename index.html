<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Rendement</title>

<!-- PWA / iOS home screen -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0e14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Rendement" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon.png" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app">

  <header class="topbar">
    <span class="brand">Rendement</span>
    <span id="today-date" class="date"></span>
  </header>

  <section class="hero">
    <div id="hero-status" class="hero-status idle">
      <span class="dot"></span>
      <span id="hero-status-text">En attente</span>
    </div>
    <div id="hero-timer" class="hero-timer">00:00:00</div>
    <div id="hero-hint" class="hero-hint">Appuie sur une catégorie pour démarrer</div>
  </section>

  <section class="cats">
    <button type="button" class="cat" data-cat="cms" style="--c: var(--cms)">
      <span class="cat-left">
        <span class="cat-icon" aria-hidden="true"></span>
        <span class="cat-name">TEMPS CMS</span>
      </span>
      <span class="cat-right">
        <span class="cat-total" id="total-cms">0:00</span>
        <span class="cat-action">▶</span>
      </span>
    </button>

    <button type="button" class="cat" data-cat="cf" style="--c: var(--cf)">
      <span class="cat-left">
        <span class="cat-icon" aria-hidden="true"></span>
        <span class="cat-name">TEMPS CF</span>
      </span>
      <span class="cat-right">
        <span class="cat-total" id="total-cf">0:00</span>
        <span class="cat-action">▶</span>
      </span>
    </button>

    <button type="button" class="cat" data-cat="rep" style="--c: var(--rep)">
      <span class="cat-left">
        <span class="cat-icon" aria-hidden="true"></span>
        <span class="cat-name">TEMPS RÉPARATION</span>
      </span>
      <span class="cat-right">
        <span class="cat-total" id="total-rep">0:00</span>
        <span class="cat-action">▶</span>
      </span>
    </button>
  </section>

  <footer class="footer">
    <div class="grand-total">
      <span class="grand-total-label">Total non-productif</span>
      <span id="grand-total" class="grand-total-value">0:00</span>
    </div>
    <button type="button" id="btn-reset" class="btn-reset">Remettre à zéro</button>
  </footer>

</div>

<script src="js/app.js"></script>
</body>
</html>
